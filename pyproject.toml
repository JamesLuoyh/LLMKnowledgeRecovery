[project]
name = "knowledge-recovery"
version = "0.0.1"
description = "Domain records, canonical hashes, and stage dispatch for clean-answer knowledge recovery."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pyyaml>=6.0.3",
]

[project.scripts]
kr = "knowledge_recovery.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

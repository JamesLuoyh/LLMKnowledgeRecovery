[project]
name = "knowledge-recovery"
version = "0.0.1"
description = "Domain records, canonical hashes, and stage dispatch for clean-answer knowledge recovery."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pyyaml>=6.0.3",
    "tqdm>=4.70",
]

[project.optional-dependencies]
model = ["torch>=2.11", "transformers>=5.20"]
plots = [
    "matplotlib>=3.9",
    "wandb>=0.19",
]

[project.scripts]
kr = "knowledge_recovery.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
